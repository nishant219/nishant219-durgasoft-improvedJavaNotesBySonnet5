<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Durgasoft Notes Reader</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link id="hljs-theme" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<script>
  (function () {
    var saved = localStorage.getItem("theme");
    var theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<style>
  :root {
    --bg: #ffffff;
    --bg-side: #f6f7f9;
    --fg: #1a1a1a;
    --fg-muted: #666;
    --border: #e2e2e6;
    --accent: #7c3aed;
    --accent-bg: #ede9fe;
    --code-bg: #f2f2f5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16161a;
      --bg-side: #1c1c22;
      --fg: #e8e8ec;
      --fg-muted: #9a9aa5;
      --border: #2c2c34;
      --accent: #a78bfa;
      --accent-bg: #2c2440;
      --code-bg: #24242c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16161a;
    --bg-side: #1c1c22;
    --fg: #e8e8ec;
    --fg-muted: #9a9aa5;
    --border: #2c2c34;
    --accent: #a78bfa;
    --accent-bg: #2c2440;
    --code-bg: #24242c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    height: 100dvh;
    overflow: hidden;
  }
  #sidebar {
    width: 300px;
    min-width: 300px;
    background: var(--bg-side);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: transform 0.25s ease;
    z-index: 100;
  }
  #overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 99;
  }
  #overlay.visible { display: block; }
  #mobile-bar {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--bg-side);
    border-bottom: 1px solid var(--border);
    width: 100%;
    flex-shrink: 0;
  }
  #hamburger {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    border-radius: 6px;
    width: 34px;
    height: 34px;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  #mobile-title {
    font-size: 14px;
    font-weight: 600;
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #sidebar-header {
    padding: 14px 14px 10px;
    border-bottom: 1px solid var(--border);
  }
  #sidebar-header h1 {
    font-size: 15px;
    margin: 0 0 10px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  #theme-toggle {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    border-radius: 6px;
    width: 28px;
    height: 28px;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #theme-toggle:hover { background: var(--accent-bg); }
  @media (max-width: 640px) {
    #sidebar {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      transform: translateX(-100%);
    }
    #sidebar.open { transform: translateX(0); }
    #mobile-bar { display: flex; }
  }
  #credits {
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--fg-muted);
    text-align: center;
  }
  #credits a { color: var(--accent); text-decoration: none; }
  #credits a:hover { text-decoration: underline; }
  #search {
    width: 100%;
    padding: 7px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    font-size: 13px;
  }
  #tree {
    flex: 1;
    overflow-y: auto;
    padding: 6px;
  }
  .group { margin-bottom: 2px; }
  .group-label {
    padding: 7px 8px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--fg-muted);
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .group-label .count {
    margin-left: auto;
    font-weight: 400;
    opacity: 0.7;
  }
  .group-label .arrow {
    transition: transform 0.15s;
    font-size: 10px;
  }
  .group.collapsed .arrow { transform: rotate(-90deg); }
  .group.collapsed .notes { display: none; }
  .note-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 8px 6px 18px;
    font-size: 13px;
    border-radius: 6px;
    cursor: pointer;
    color: var(--fg);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .note-item:hover { background: var(--border); }
  .note-item.active { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
  .note-item .dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: transparent;
    flex-shrink: 0;
  }
  .note-item.read .dot { background: var(--fg-muted); }
  .note-item.active .dot { background: var(--accent); }
  #main {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 0;
  }
  #content {
    max-width: 780px;
    width: 100%;
    padding: 48px 32px 100px;
  }
  #placeholder {
    color: var(--fg-muted);
    padding: 48px 32px;
    text-align: center;
  }
  @media (max-width: 640px) {
    #content {
      padding: 16px 16px 80px;
    }
  }
  #content h1, #content h2, #content h3 { line-height: 1.3; }
  #content h1 { font-size: 26px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  #content h2 { font-size: 20px; margin-top: 32px; }
  #content h3 { font-size: 16px; }
  #content p, #content li { line-height: 1.65; font-size: 15px; }
  #content code {
    background: var(--code-bg);
    padding: 2px 5px;
    border-radius: 4px;
    font-size: 13px;
  }
  #content pre {
    background: var(--code-bg);
    padding: 14px;
    border-radius: 8px;
    overflow-x: auto;
  }
  #content pre code { background: none; padding: 0; }
  #content blockquote {
    border-left: 3px solid var(--accent);
    margin: 0;
    padding: 4px 16px;
    color: var(--fg-muted);
  }
  #content table { border-collapse: collapse; width: 100%; font-size: 14px; }
  #content th, #content td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  #content img { max-width: 100%; }
  #nav-links {
    display: flex;
    justify-content: space-between;
    margin-top: 40px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    gap: 12px;
  }
  #nav-links button {
    flex: 1;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg-side);
    color: var(--fg);
    cursor: pointer;
    font-size: 13px;
  }
  #nav-links button:disabled { opacity: 0.4; cursor: default; }
  #nav-links button:not(:disabled):hover { background: var(--accent-bg); }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  #scroll-top {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg-side);
    color: var(--fg);
    font-size: 18px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    z-index: 50;
    transition: background 0.15s;
  }
  #scroll-top:hover { background: var(--accent-bg); color: var(--accent); }
</style>
</head>

<div id="scroll-top" title="Back to top">↑</div>
<div id="overlay"></div>
<div id="sidebar">
  <div id="sidebar-header">
    <h1>
      <span>Durgasoft Notes</span>
      <button id="theme-toggle" title="Toggle light/dark theme"></button>
    </h1>
    <input id="search" placeholder="Search notes..." />
  </div>
  <div id="tree"></div>
  <div id="credits">Notes & UI by <a href="https://github.com/nishant219" target="_blank" rel="noopener">nishant219</a></div>
</div>
<div id="main">

    <span id="mobile-title">Durgasoft Notes</span>

  <div id="placeholder">Pick a note from the sidebar to start studying.</div>
  <div id="content" style="display:none"></div>
</div>

const flatNotes = MANIFEST.flatMap(g => g.notes);

const treeEl = document.getElementById("tree");
const contentEl = document.getElementById("content");
const placeholderEl = document.getElementById("placeholder");
const searchEl = document.getElementById("search");

function getReadSet() {
  try { return new Set(JSON.parse(localStorage.getItem("readNotes") || "[]")); }
  catch { return new Set(); }
}
function markRead(path) {
  try {
    const s = getReadSet();
    s.add(path);
    localStorage.setItem("readNotes", JSON.stringify([...s]));
  } catch {}
}

let activePath = null;

function renderTree(filter) {
  const q = (filter || "").trim().toLowerCase();
  const readSet = getReadSet();
  treeEl.innerHTML = "";
  MANIFEST.forEach(group => {
    const notes = q
      ? group.notes.filter(n => n.title.toLowerCase().includes(q))
      : group.notes;
    if (q && notes.length === 0) return;

    const groupEl = document.createElement("div");
    groupEl.className = "group";

    const labelEl = document.createElement("div");
    labelEl.className = "group-label";
    labelEl.innerHTML = `<span class="arrow">▾</span><span>${group.label}</span><span class="count">${group.notes.length}</span>`;
    labelEl.onclick = () => groupEl.classList.toggle("collapsed");
    groupEl.appendChild(labelEl);

    const notesEl = document.createElement("div");
    notesEl.className = "notes";
    notes.forEach(n => {
      const item = document.createElement("div");
      item.className = "note-item" + (n.path === activePath ? " active" : "") + (readSet.has(n.path) ? " read" : "");
      item.innerHTML = `<span class="dot"></span><span>${n.title}</span>`;
      item.onclick = () => loadNote(n.path);
      notesEl.appendChild(item);
    });
    groupEl.appendChild(notesEl);
    treeEl.appendChild(groupEl);
  });
}

async function loadNote(path) {
  activePath = path;
  placeholderEl.style.display = "none";
  contentEl.style.display = "block";
  contentEl.innerHTML = "<p style='color:var(--fg-muted)'>Loading…</p>";

  try {
    const res = await fetch(RAW_BASE + path);
    if (!res.ok) throw new Error(res.status);
    const md = await res.text();
    contentEl.innerHTML = marked.parse(md);
    contentEl.querySelectorAll("pre code").forEach(el => hljs.highlightElement(el));
  } catch (e) {
    contentEl.innerHTML = `<p style="color:#e33">Failed to load note (${e.message}). Check your connection.</p>`;
  }

  markRead(path);
  renderTree(searchEl.value);
  renderNavLinks();
  contentEl.scrollIntoView();
  document.getElementById("main").scrollTop = 0;

  // close sidebar on mobile after picking a note
  closeSidebar();
  const noteTitle = flatNotes.find(n => n.path === path)?.title || "Durgasoft Notes";
  if (mobileTitleEl) mobileTitleEl.textContent = noteTitle;

  const url = new URL(location);
  url.searchParams.set("note", path);
  history.replaceState(null, "", url);
}

function renderNavLinks() {
  const idx = flatNotes.findIndex(n => n.path === activePath);
  const existing = document.getElementById("nav-links");
  if (existing) existing.remove();
  if (idx === -1) return;

  const nav = document.createElement("div");
  nav.id = "nav-links";
  const prev = flatNotes[idx - 1];
  const next = flatNotes[idx + 1];

  const prevBtn = document.createElement("button");
  prevBtn.textContent = prev ? `← ${prev.title}` : "← Start";
  prevBtn.disabled = !prev;
  if (prev) prevBtn.onclick = () => loadNote(prev.path);

  const nextBtn = document.createElement("button");
  nextBtn.textContent = next ? `${next.title} →` : "End →";
  nextBtn.disabled = !next;
  if (next) nextBtn.onclick = () => loadNote(next.path);

  nav.appendChild(prevBtn);
  nav.appendChild(nextBtn);
  contentEl.appendChild(nav);
}

searchEl.addEventListener("input", () => renderTree(searchEl.value));

// mobile sidebar toggle
const sidebarEl = document.getElementById("sidebar");
const overlayEl = document.getElementById("overlay");
const hamburgerEl = document.getElementById("hamburger");
const mobileTitleEl = document.getElementById("mobile-title");

function openSidebar() { sidebarEl.classList.add("open"); overlayEl.classList.add("visible"); }
function closeSidebar() { sidebarEl.classList.remove("open"); overlayEl.classList.remove("visible"); }

hamburgerEl.addEventListener("click", openSidebar);
overlayEl.addEventListener("click", closeSidebar);

// scroll to top button
const scrollTopBtn = document.getElementById("scroll-top");
const mainEl = document.getElementById("main");
mainEl.addEventListener("scroll", () => {
  scrollTopBtn.style.display = mainEl.scrollTop > 300 ? "flex" : "none";
});
scrollTopBtn.addEventListener("click", () => {
  mainEl.scrollTo({ top: 0, behavior: "smooth" });
});

const themeToggleEl = document.getElementById("theme-toggle");
const hljsThemeEl = document.getElementById("hljs-theme");
const HLJS_THEME_URL = {
  light: "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css",
  dark: "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css",
};

function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  hljsThemeEl.href = HLJS_THEME_URL[theme];
  themeToggleEl.textContent = theme === "dark" ? "☀️" : "🌙";
  localStorage.setItem("theme", theme);
}

themeToggleEl.onclick = () => {
  const current = document.documentElement.getAttribute("data-theme");
  applyTheme(current === "dark" ? "light" : "dark");
};

applyTheme(document.documentElement.getAttribute("data-theme"));

renderTree();

const initialPath = new URL(location).searchParams.get("note");
if (initialPath && flatNotes.some(n => n.path === initialPath)) {
  loadNote(initialPath);
}
</script>
